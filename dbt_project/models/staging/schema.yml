version: 2

models:
  - name: stg_raw_gis_agricultural_zones
    description: >
      Bronze-to-silver pass-through of agricultural zone polygons (SIGPAC / GIS).
      Preserves PostGIS geometry for downstream spatial models.
    columns:
      - name: cod_prov
        description: Province code from GIS properties.
      - name: name
        description: Zone or region name from GIS properties.
      - name: cod_ccaa
        description: Autonomous community code.
      - name: cartodb_id
        description: Source feature identifier.
      - name: geometry
        description: Polygon geometry in EPSG:4326 (PostGIS).
      - name: loaded_at
        tests:
          - not_null

  - name: stg_reservoir_catalog
    description: >
      Bronze-to-silver pass-through of the REDIAM reservoir catalog.
      Preserves source column names for downstream intermediate cleaning.
    columns:
      - name: cod_est
        tests:
          - not_null
          - unique
      - name: nombre
        description: Official reservoir name from REDIAM.
      - name: provincia
        description: Province where the reservoir is located.
      - name: dist_dem
        description: Hydrographic demarcation (e.g. GUADALQUIVIR).
      - name: loaded_at
        tests:
          - not_null

  - name: stg_embalses
    description: >
      Bronze-to-silver pass-through of daily reservoir readings from REDIAM.
    columns:
      - name: fecha
        description: Date of the hydrological observation.
        tests:
          - not_null
      - name: cod_est
        description: REDIAM reservoir station code (e.g. E01).
        tests:
          - not_null
      - name: reserva_hm3
        description: Current stored water volume in cubic hectometres.
      - name: capacidad_hm3
        description: Maximum reservoir capacity in cubic hectometres.
      - name: porcentaje_llenado
        description: Percentage of reservoir capacity currently filled.
      - name: loaded_at
        description: UTC timestamp when Airflow loaded the raw row.
        tests:
          - not_null

  - name: stg_ria_clima
    description: >
      Bronze-to-silver pass-through of daily agroclimatic readings from the RIA network.
    columns:
      - name: fecha
        description: Date of the meteorological observation.
        tests:
          - not_null
      - name: provincia_id
        description: Province identifier in the RIA catalog.
        tests:
          - not_null
      - name: provincia_nombre
        description: Province name as returned by the source API.
      - name: codigo_estacion
        description: Station code within the province.
        tests:
          - not_null
      - name: nombre_estacion
        description: Station name as returned by the source API.
      - name: temp_media
        description: Daily mean air temperature in degrees Celsius.
      - name: temp_max
        description: Daily maximum air temperature in degrees Celsius.
      - name: temp_min
        description: Daily minimum air temperature in degrees Celsius.
      - name: humedad_media
        description: Daily mean relative humidity as a percentage.
      - name: precipitacion
        description: Daily precipitation in millimetres.
      - name: et0
        description: Reference evapotranspiration (ET0) in millimetres.
      - name: loaded_at
        description: UTC timestamp when Airflow loaded the raw row.
        tests:
          - not_null
