version: 2

models:
  - name: stg_gis_agricultural_zones
    description: >
      Bronze-to-silver agricultural zone polygons (SIGPAC / GIS): typed ids, PostGIS geometry as geom.
    columns:
      - name: province_id
        description: Province code from GIS properties (source cod_prov).
      - name: province_name
        description: Zone or region name (source name).
      - name: region_id
        description: Autonomous community code (source cod_ccaa).
      - name: cartodb_id
        description: Source feature identifier.
      - name: geom
        description: Polygon geometry in EPSG:4326 (PostGIS).
      - name: loaded_at
        tests:
          - not_null

  - name: stg_reservoir_catalog
    description: >
      Bronze-to-silver reservoir catalog from REDIAM: trimmed text fields, cod_est as reservoir_id,
      raw WKT geometry as geometry_wkt (from source geom).
    columns:
      - name: reservoir_id
        description: REDIAM reservoir station code (source cod_est).
        tests:
          - not_null
          - unique
      - name: reservoir_name
        description: Official reservoir name from REDIAM (source nombre).
      - name: province
        description: Province where the reservoir is located (source provincia).
      - name: hydrographic_district
        description: Hydrographic demarcation (source dist_dem).
      - name: geometry_wkt
        description: Geometry as WKT text (source geom).
      - name: loaded_at
        tests:
          - not_null

  - name: stg_embalses
    description: >
      Bronze-to-silver daily reservoir readings from REDIAM (typed columns, English names).
    columns:
      - name: observation_date
        description: Date of the hydrological observation (source fecha).
        tests:
          - not_null
      - name: reservoir_code
        description: REDIAM reservoir station code (source cod_est).
        tests:
          - not_null
      - name: stored_volume_hm3
        description: Current stored water volume (hm³).
      - name: reservoir_capacity_hm3
        description: Maximum reservoir capacity (hm³).
      - name: fill_percentage
        description: Percentage of capacity filled.
      - name: loaded_at
        description: UTC timestamp when the row was loaded to raw.
        tests:
          - not_null

  - name: stg_ria_clima
    description: >
      Bronze-to-silver daily agroclimatic readings from the RIA network (typed columns, English names).
    columns:
      - name: observation_date
        description: Date of the meteorological observation.
        tests:
          - not_null
      - name: province_id
        description: Province identifier in the RIA catalog (source provincia_id).
        tests:
          - not_null
      - name: province_name
        description: Province name (source provincia_nombre).
      - name: station_code
        description: Station code within the province (source codigo_estacion).
        tests:
          - not_null
      - name: station_name
        description: Station name (source nombre_estacion).
      - name: mean_temperature_c
        description: Daily mean air temperature (°C).
      - name: max_temperature_c
        description: Daily maximum air temperature (°C).
      - name: min_temperature_c
        description: Daily minimum air temperature (°C).
      - name: mean_humidity_pct
        description: Daily mean relative humidity (%).
      - name: max_humidity_pct
        description: Daily maximum relative humidity (%).
      - name: min_humidity_pct
        description: Daily minimum relative humidity (%).
      - name: precipitation_mm
        description: Daily precipitation (mm).
      - name: solar_radiation
        description: Solar radiation (source units from RIA).
      - name: mean_wind_speed
        description: Mean wind speed.
      - name: max_wind_speed
        description: Maximum wind speed.
      - name: mean_wind_direction_deg
        description: Mean wind direction (degrees).
      - name: max_wind_direction_deg
        description: Wind direction at max speed (degrees).
      - name: reference_evapotranspiration_mm
        description: Reference evapotranspiration ET0 (mm).
      - name: battery_level
        description: Station battery level where reported.
      - name: source_updated_at
        description: Source last-modified timestamp when present.
      - name: loaded_at
        description: UTC timestamp when the row was loaded to raw.
        tests:
          - not_null
